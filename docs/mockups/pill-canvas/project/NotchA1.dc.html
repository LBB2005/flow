<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notch A1: Calm Scroll</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px">
<dc-import name="Notch" variant="a" wave="scroll" sample-ms="120" smooth="0.55" bar-ms="180" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
